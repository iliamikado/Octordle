name: Deploy server to Senko

on:
  push:
    branches: ["main"]

jobs:
  deploy:
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          fetch-depth: 1

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

      - name: Change .env
        run: |
          echo POSTGRES_USER="${{ secrets.POSTGRES_USER }}" >> ".env"
          echo POSTGRES_PASSWORD="${{ secrets.POSTGRES_PASSWORD }}" >> ".env"

      - name: Build
        run: |
          docker build -t octordle_server:latest ./server
          docker build -t octordle_client:latest \
            --build-arg NEXT_PUBLIC_TG_TOKEN=${{ secrets.TG_BOT_TOCKEN }} \
            --build-arg NEXT_PUBLIC_CHAT_ID=${{ secrets.CHAT_ID }} \
            --build-arg NEXT_PUBLIC_GOOGLE_ID=${{ secrets.GOOGLE_ID }} \
            --build-arg NEXT_PUBLIC_SERVER_URL=${{ vars.NEXT_PUBLIC_SERVER_URL }} \
            .

      - name: Save docker images to archive
        run: |
          docker save octordle_server:latest octordle_client:latest | gzip -1 > docker-images.tar.gz

      - name: Copy deploy files to server
        run: |
          scp -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no \
            docker-images.tar.gz docker-compose.yml .env app.conf root@150.241.79.230:~

      - name: Cleanup, load images and restart containers
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=no root@150.241.79.230 \
            'set -e
             find ~ -maxdepth 1 -type f \( -name "*.zip" -o -name "*.tar.gz" -o -name "*.tar" \) ! -name "docker-images.tar.gz" -delete || true
             sudo find /var/lib/docker/containers -type f -name "*-json.log" -exec truncate -s 0 {} \; || true
             sudo find /var/log -type f \( -name "*.gz" -o -name "*.old" -o -name "*.1" \) -delete || true
             sudo docker image prune -af || true
             gunzip -c ~/docker-images.tar.gz | sudo docker load
             rm -f ~/docker-images.tar.gz
             sudo docker-compose up -d --force-recreate --remove-orphans'
