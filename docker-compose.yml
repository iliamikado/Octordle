version: '2.4'

x-json-file-logging: &json-file-logging
  driver: json-file
  options:
    max-size: '10m'
    max-file: '3'

services:
  octordle_nginx:
    image: nginx
    container_name: octordle_nginx
    depends_on:
      - octordle_server
      - octordle_client
    command: [nginx-debug, '-g', 'daemon off;']
    restart: unless-stopped
    mem_limit: 96m
    pids_limit: 64
    logging: *json-file-logging
    volumes:
      - ./app.conf:/etc/nginx/conf.d/default.conf
      - /etc/letsencrypt:/etc/letsencrypt:ro
    ports:
      - 80:80
      - 443:443
  octordle_client:
    image: octordle_client:latest
    container_name: octordle_client
    restart: unless-stopped
    environment:
      - NODE_OPTIONS=--max-old-space-size=128
    mem_limit: 256m
    pids_limit: 100
    logging: *json-file-logging
  octordle_server:
    image: octordle_server:latest
    container_name: octordle_server
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ./.env
    restart: unless-stopped
    environment:
      - POSTGRES_DOMAIN=postgres
      - NODE_OPTIONS=--max-old-space-size=128
    mem_limit: 192m
    pids_limit: 100
    logging: *json-file-logging
  postgres:
    image: postgres:15
    container_name: postgres
    env_file:
      - ./.env
    volumes:
      - ./demodb-data:/var/lib/postgresql/data
    restart: unless-stopped
    mem_limit: 320m
    pids_limit: 100
    logging: *json-file-logging
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB']
      interval: 10s
      timeout: 5s
      retries: 5
